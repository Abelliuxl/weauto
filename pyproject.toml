[project]
name = "weauto"
version = "0.1.0"
description = "Cross-platform WeChat GUI RPA automation for macOS and Windows."
requires-python = ">=3.12,<3.13"
dependencies = [
  "certifi>=2024.8.30",
  "cryptography>=42,<47",
  "numpy>=1.26.0",
  "onnxruntime<1.21; sys_platform == 'win32'",
  "onnxruntime<1.24; sys_platform != 'win32'",
  "opencv-python==4.10.0.84",
  "Pillow>=10.0.0",
  "playwright>=1.60.0",
  "pyautogui>=0.9.54",
  "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
  "pyperclip>=1.8.2",
  "rapidocr-onnxruntime>=1.4.4,<1.5",
  "websockets>=15.0,<17",
  # Menu-bar control panel (app/). The bot itself does not import these.
  "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
  "rumps>=0.4.0; sys_platform == 'darwin'",
  "pystray>=0.19.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["archive"]

[tool.pytest.ini_options]
pythonpath = ["."]
